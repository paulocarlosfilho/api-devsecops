name: DevSecOps Pipeline - API

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # 1. Lint e Proteção de Segredos
  lint-and-secrets:
    name: Lint & Proteção de Segredos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Build e SAST (Quality Gate)
  build-and-sast:
    name: Build & SAST
    needs: lint-and-secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Snyk SAST
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test

      - name: Run Unit Tests
        run: npm run test:unit --if-present

  # 3. Build, Push & Scans de Segurança (Trivy/Checkov)
  pull-and-scan:
    name: Build, Push & Scans (Trivy/Checkov)
    needs: build-and-sast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
           paulocarlosfilho/aponti-api-fap-desafio-final-pratico:latest
           paulocarlosfilho/aponti-api-fap-desafio-final-pratico:1.0.1

      - name: Run Trivy vulnerability scanner on Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'paulocarlosfilho/aponti-api-fap-desafio-final-pratico:1.0.1'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Run Checkov scanner on Terraform IaC
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform

  # 4. Provisionamento (LocalStack + Terraform)
  provisioning:
    name: Provisionamento
    needs: pull-and-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start LocalStack
        uses: LocalStack/setup-localstack@v0.2.2
        with:
          services: "s3,ec2"
          version: "latest"
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve
        env:
          AWS_ACCESS_KEY_ID: "test"
          AWS_SECRET_ACCESS_KEY: "test"
          AWS_DEFAULT_REGION: "us-east-1"

  # 5. Deploy em Staging e DAST (Quality Gate Dinâmico)
  deploy-staging-dast:
    name: Deploy em Staging / DAST
    needs: provisioning
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Start App via Docker Compose (Staging)
        run: |
          docker compose up -d

      - name: Wait for API
        run: sleep 15

      - name: Run OWASP ZAP Scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: 'http://localhost:3000/metrics'
          fail_action: false
          artifact_name: ''
        
      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report.html

  # 6. Deploy em Produção
  deploy-production:
    name: Deploy em Produção
    needs: deploy-staging-dast
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/paulocarlos'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Production Environment
        run: |
          echo "Executando deploy automatizado e seguro em produção..."