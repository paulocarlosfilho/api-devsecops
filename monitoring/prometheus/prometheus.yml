global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "ecommerce-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3000"]
        labels:
          service: "ecommerce-api"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
